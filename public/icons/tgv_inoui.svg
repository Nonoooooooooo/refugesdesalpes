<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="100%" height="100%">
  <defs>
    <!-- Ombre portée douce -->
    <filter id="tgv-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Dégradé métallique carrosserie TGV inOui -->
    <linearGradient id="tgv-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Dégradé Carmillon officiel SNCF inOui -->
    <linearGradient id="sncf-carmillon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Dégradé vitres teintées -->
    <linearGradient id="tgv-glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Rails et ballast stylisés -->
  <line x1="10" y1="98" x2="470" y2="98" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="102" x2="470" y2="102" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Groupe Train TGV avec ombre -->
  <g filter="url(#tgv-shadow)">
    <!-- ══════════ MOTRICE DE TÊTE (À GAUCHE) ══════════ -->
    <!-- Pantographe haute vitesse -->
    <path d="M 120 40 L 132 20 L 152 20 L 140 40" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="126" y1="18" x2="158" y2="18" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="40" x2="140" y2="40" stroke="#475569" stroke-width="4"/>

    <!-- Carrosserie profil aérodynamique nez TGV -->
    <path d="M 24 82
             C 32 78, 48 64, 62 55
             C 74 47, 92 41, 115 40
             L 205 40
             L 205 84
             L 36 84
             C 28 84, 22 83, 24 82 Z"
          fill="url(#tgv-body-grad)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Bandeau supérieur noir graphite -->
    <path d="M 72 50
             C 86 45, 102 42, 120 42
             L 205 42
             L 205 52
             L 80 52 Z"
          fill="#1e293b"/>

    <!-- Liseré signature Carmillon SNCF sous la baie vitrée -->
    <path d="M 52 64
             C 65 58, 85 53, 110 53
             L 205 53
             L 205 55.5
             L 60 55.5 Z"
          fill="url(#sncf-carmillon-grad)"/>

    <!-- Pare-brise profilé cabine de conduite -->
    <path d="M 54 62
             C 60 56, 72 52, 85 51
             L 85 58
             L 58 64 Z"
          fill="#0f172a" stroke="#38bdf8" stroke-width="0.75"/>

    <!-- Logo inOui stylisé sur la motrice -->
    <text x="96" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" font-style="italic" fill="#be123c" letter-spacing="-0.5">
      in<tspan fill="#e11d48">O</tspan>ui
    </text>

    <!-- Porte d'accès cabine avec liseré carmin -->
    <rect x="180" y="58" width="12" height="24" rx="1.5" fill="#e2e8f0" stroke="#be123c" stroke-width="1.5"/>
    <circle cx="183" cy="70" r="1" fill="#475569"/>

    <!-- Bogies motrice (Roues) -->
    <rect x="42" y="83" width="46" height="7" rx="3" fill="#334155"/>
    <circle cx="52" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="78" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    
    <rect x="150" y="83" width="46" height="7" rx="3" fill="#334155"/>
    <circle cx="160" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="186" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <!-- Soufflet d'intercirculation articulé -->
    <rect x="205" y="44" width="7" height="38" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <line x1="208.5" y1="44" x2="208.5" y2="82" stroke="#475569" stroke-width="1"/>

    <!-- ══════════ VOITURE DUPLEX 1ère/2nde CLASSE (À DROITE) ══════════ -->
    <rect x="212" y="40" width="250" height="44" rx="2" fill="url(#tgv-body-grad)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Bandeau noir continu étage supérieur et inférieur -->
    <rect x="212" y="42" width="250" height="10" fill="#1e293b"/>
    <rect x="212" y="66" width="250" height="10" fill="#1e293b"/>

    <!-- Liseré Carmillon SNCF longitudinal -->
    <rect x="212" y="53" width="250" height="2.5" fill="url(#sncf-carmillon-grad)"/>

    <!-- Fenêtres Étage Supérieur (Duplex) -->
    <g fill="url(#tgv-glass-grad)" stroke="#475569" stroke-width="0.5">
      <rect x="220" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="242" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="264" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="286" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="330" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="352" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="374" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="396" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="418" y="44" width="16" height="6.5" rx="1.5"/>
      <rect x="440" y="44" width="16" height="6.5" rx="1.5"/>
    </g>

    <!-- Fenêtres Étage Inférieur -->
    <g fill="url(#tgv-glass-grad)" stroke="#475569" stroke-width="0.5">
      <rect x="220" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="242" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="264" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="286" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="330" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="352" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="374" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="396" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="418" y="68" width="16" height="6.5" rx="1.5"/>
      <rect x="440" y="68" width="16" height="6.5" rx="1.5"/>
    </g>

    <!-- Porte d'accès voyageur centrale Carmillon inOui -->
    <rect x="307" y="46" width="18" height="36" rx="2" fill="url(#sncf-carmillon-grad)" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="312" y="50" width="8" height="12" rx="1.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Chiffre de classe '2' / '1' -->
    <text x="314" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">2</text>

    <!-- Bogie partagé intermédiaire (Système Jacobs TGV) -->
    <rect x="222" y="83" width="46" height="7" rx="3" fill="#334155"/>
    <circle cx="232" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="258" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <rect x="410" y="83" width="46" height="7" rx="3" fill="#334155"/>
    <circle cx="420" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="446" cy="89" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  </g>
</svg>
