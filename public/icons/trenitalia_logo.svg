<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <!-- Trenitalia official emblem: iconic dynamic aerodynamic swooshes -->
  <g transform="translate(10, 10)">
    <!-- Shadow / glow backdrop -->
    <filter id="tren-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.3"/>
    </filter>

    <!-- Top green ribbon / wing (FS Green #008751 / #059669) -->
    <path d="M 12 18 C 28 6, 68 8, 86 32 C 72 34, 48 24, 30 36 C 20 42, 14 54, 8 72 C 6 54, 6 32, 12 18 Z" fill="#008751" filter="url(#tren-glow)"/>
    <path d="M 32 14 C 52 14, 82 28, 92 48 C 76 46, 56 32, 38 30 Z" fill="#10b981"/>

    <!-- Bottom red aerodynamic wing (#d52b1e) -->
    <path d="M 22 52 C 38 46, 68 56, 82 82 C 64 80, 48 70, 32 72 C 22 74, 16 80, 14 86 C 16 74, 18 60, 22 52 Z" fill="#d52b1e"/>
    
    <!-- Central dynamic train nose speedlines -->
    <path d="M 44 46 L 76 46 L 68 54 L 38 54 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Wordmark TRENITALIA -->
    <text x="108" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="3" fill="#ffffff">
      TRENITALIA
    </text>

    <!-- Sub-badge FRECCIAROSSA 1000 • ALTA VELOCITÀ -->
    <g transform="translate(110, 70)">
      <rect x="0" y="0" width="138" height="20" rx="4" fill="#d52b1e"/>
      <text x="69" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" letter-spacing="1" fill="#ffffff" text-anchor="middle">
        FRECCIAROSSA
      </text>

      <rect x="144" y="0" width="46" height="20" rx="4" fill="#059669"/>
      <text x="167" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" letter-spacing="1" fill="#ffffff" text-anchor="middle">
        1000
      </text>

      <text x="200" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#a7f3d0">
        ALTA VELOCITÀ
      </text>
    </g>
  </g>
</svg>
