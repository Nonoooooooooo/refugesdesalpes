          <header>
            <h1 style="font-size: 2rem; font-weight: bold; color: #34d399; margin-bottom: 0.5rem;">
              Refuges des Alpes — Carte Interactive des Refuges, Cabanes &amp; Transports de Montagne
            </h1>
            <p style="font-size: 1.1rem; color: #94a3b8; margin-bottom: 2rem;">
              Trouvez et explorez plus de 1 500 refuges gardés, cabanes non gardées, gîtes d'étape et bivouacs dans les Alpes françaises. Accédez aux informations de transports en commun (TGV, TER, cars, navettes estivales), sentiers de randonnée, webcams en direct et bulletins d'estimation du risque d'avalanche (BERA).
            </p>
          </header>

          <main>
            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">🏔️ Refuges par Massif Alpin</h2>
              <p>Notre carte interactive couvre l'ensemble des massifs des Alpes françaises :</p>
              <ul style="columns: 2; column-gap: 2rem; margin: 0.8rem 0; padding-left: 1.2rem; color: #cbd5e1;">
                <li><strong>Massif du Mont-Blanc</strong> — Refuge du Goûter, Refuge des Cosmiques, Refuge Albert 1er, Refuge de Tête Rousse</li>
                <li><strong>Parc National de la Vanoise</strong> — Refuge de la Vanoise, Refuge du Col de la Vanoise, Refuge de l'Arpont, Refuge du Fond d'Aussois</li>
                <li><strong>Parc National des Écrins</strong> — Refuge du Glacier Blanc, Refuge du Pelvoux, Refuge de la Pilatte, Refuge du Sélé</li>
                <li><strong>Massif de Belledonne</strong> — Refuge de la Pra, Refuge Jean Collet, Cabane de la Balmette</li>
                <li><strong>Queyras</strong> — Refuge Agnel, Refuge de la Blanche, Gîte du Roux</li>
                <li><strong>Mercantour</strong> — Refuge de Nice, Refuge des Merveilles, Refuge de la Cougourde</li>
                <li><strong>Chartreuse</strong> — Chalet de l'Aulp du Seuil, Habert de Chamechaude</li>
                <li><strong>Vercors</strong> — Cabane de Pré Peyret, Cabane des Aiguillettes, Refuge de Gève</li>
                <li><strong>Chablais &amp; Aravis</strong> — Refuge de Gramusset, Refuge de la Pointe de Chalune</li>
                <li><strong>Beaufortain &amp; Lauzière</strong> — Refuge de Presset, Refuge du Plan de la Lai</li>
              </ul>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">🚌 Accès sans Voiture — Transports en Commun Alpins</h2>
              <p>Planifiez vos randonnées <strong>sans voiture</strong> grâce à notre réseau de transports complet :</p>
              <ul style="margin: 0.8rem 0; padding-left: 1.2rem; color: #cbd5e1;">
                <li><strong>Lignes TGV et TER</strong> — Gares de Chambéry, Albertville, Grenoble, Briançon, Saint-Gervais, Bourg-Saint-Maurice, Modane</li>
                <li><strong>Cars régionaux et départementaux</strong> — Lignes Transisère, Zou! PACA, Savoie, Haute-Savoie</li>
                <li><strong>Navettes estivales de montagne</strong> — Accès aux vallées reculées en juillet-août (Vénéon, Vallouise, Val Cenis, Vallée des Merveilles)</li>
                <li><strong>Correspondances multimodales</strong> — Combinaisons train + bus + navette vers chaque point de départ de randonnée</li>
              </ul>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">🥾 Sentiers de Randonnée</h2>
              <p>Visualisez les sentiers balisés officiels superposés sur la carte IGN, OpenTopoMap ou vue satellite :</p>
              <ul style="margin: 0.8rem 0; padding-left: 1.2rem; color: #cbd5e1;">
                <li>GR 5 — Grande Traversée des Alpes (Lac Léman → Nice)</li>
                <li>GR 54 — Tour de l'Oisans et des Écrins</li>
                <li>Tour du Mont-Blanc (TMB)</li>
                <li>GR 58 — Tour du Queyras</li>
                <li>GR 55 — Traversée de la Vanoise</li>
                <li>Sentiers balisés Waymarked Trails (PR, GRP, GR)</li>
              </ul>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">🌧️ Radar Météo AROME Météo-France en Direct</h2>
              <p>Consultez la prévision immédiate haute résolution (modèle AROME-PI 0.01°) sur tout l'arc alpin : intensité des précipitations pluie (mm/h), chutes de neige cumulées, réflectivité radar dBZ (détection des orages) et rafales de vent en altitude avec timeline animée de -2h à +5h.</p>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">🌅 Éphémérides Solaires &amp; Coucher de Soleil par Refuge</h2>
              <p>Chaque fiche de refuge intègre un calculateur d'éphémérides avec heure exacte du lever, du coucher du soleil, de l'aube et du crépuscule doré / bleu, ainsi que l'altitude et l'azimut du soleil pour admirer les levers et couchers de soleil en altitude.</p>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">📹 Webcams &amp; Conditions en Direct</h2>
              <p>Consultez les webcams panoramiques en direct pour vérifier les conditions météo et l'enneigement avant votre départ : stations de ski, sommets, cols alpins et refuges équipés.</p>
            </section>

            <section>
              <h2 style="font-size: 1.4rem; font-weight: 700; color: #6ee7b7; margin: 1.5rem 0 0.8rem;">⚠️ Bulletins Avalanche BERA — Météo-France</h2>
              <p>Accédez aux <strong>Bulletins d'Estimation du Risque d'Avalanche (BERA)</strong> de Météo-France directement intégrés à la carte. Indice de risque de 1 à 5, orientations sensibles et altitude critique pour chaque massif.</p>
            </section>

            <p>
              Une question ? Consultez notre <a href="/faq" style="color: #34d399;">page de questions fréquentes</a>.
            </p>

            <p style="margin-top: 2rem; color: #64748b; font-size: 0.9rem;">
              Veuillez activer JavaScript dans votre navigateur pour profiter de la carte interactive haute performance.
            </p>
